name: V7.43 six LDO thermal and native U2 VIN audit (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.43/**'
      - '03_Verifiche/V7.45/**'
      - '03_Verifiche/V7.46/**'
      - '03_Verifiche/V7.47/**'
      - '03_Verifiche/V7.48/**'
      - '03_Verifiche/V7.49/**'
      - '03_Verifiche/V7.50/**'
      - '03_Verifiche/V7.51/**'
      - '03_Verifiche/V7.52/**'
      - '03_Verifiche/V7.53/**'
      - '03_Verifiche/V7.54/**'
      - '03_Verifiche/V7.55/**'
      - '03_Verifiche/V7.56/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.56_TDK_AECQ200_C103_C104_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.56_TDK_AECQ200_MLCC_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.55_TDK_C103_C104_VENDOR_CANDIDATE_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.55_TDK_BUCK_MLCC_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.52_EFUSE_MODE_DVDT_LATCHOFF_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.52_EFUSE_MODE_DVDT_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.51_TPS26600_RTN_SAFETY_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.51_TPS26600_RTN_SAFETY_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.50_JST_CONNECTORS_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.50_JST_CONNECTORS_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.49_LMX_UNUSED_PULLDOWN_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.49_LMX_PULLDOWN_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Librerie_Footprint_V7.48_TDK_C0G_HOLD/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.48_TDK_2_C0G_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.48_TDK_2_C0G_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.47_TDK_16_MLCC_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.47_TDK_16_MLCC_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Librerie_Footprint_V7.47_TDK_MLCC_HOLD/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.46_12_MURATA_GRM15_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.46_12_MURATA_GRM15_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native_rail_thermal:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: KiCad9 preinstalled, no apt/pip
        run: |
          kicad-cli version
          mkdir -p 03_Verifiche/V7.43/output-ci
      - name: Native existing seven-sheet netlist and ERC (no CAD ECO)
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.43/output-ci/v743.baseline.net 04_KiCad/Assemblaggio_RX_Power_V7.41_FB6201_TDK_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.43/output-ci/v743.baseline.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.41_FB6201_TDK_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Six-LDO sourced load and thermal limits plus native U2 pin-to-net proof
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.43 -p 'test_*.py' -v
      - name: V7.45 strict six 0-ohm PLL feed and Y1 VCC/enable net topology regression
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.45 -p 'test_*.py' -v
      - name: V7.46 native 7-sheet netlist and ERC before/after vendor bypass ECO
        run: |
          mkdir -p 03_Verifiche/V7.46/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.46/output-ci/v746.original.net 04_KiCad/Assemblaggio_RX_Power_V7.41_FB6201_TDK_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.46/output-ci/v746.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.41_FB6201_TDK_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.46/output-ci/v746.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.46_12_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.46/output-ci/v746.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.46_12_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.46 12 capacitors exact MPN/land and no net/ERC regression
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.46 -p 'test_*.py' -v
      - name: V7.47 native 7-sheet original and revised netlist/ERC once in same KiCad9 job
        run: |
          mkdir -p 03_Verifiche/V7.47/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.47/output-ci/v747.original.net 04_KiCad/Assemblaggio_RX_Power_V7.46_12_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.47/output-ci/v747.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.46_12_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.47/output-ci/v747.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.47_TDK_16_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.47/output-ci/v747.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.47_TDK_16_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.47 exact TDK 16 capacitor land geometry, MPN and 101-net parity
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.47 -p 'test_*.py' -v
      - name: V7.48 two C0G caps native original/revised seven-sheet netlist and ERC
        run: |
          mkdir -p 03_Verifiche/V7.48/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.48/output-ci/v748.original.net 04_KiCad/Assemblaggio_RX_Power_V7.47_TDK_16_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.48/output-ci/v748.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.47_TDK_16_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.48/output-ci/v748.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.48_TDK_2_C0G_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.48/output-ci/v748.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.48_TDK_2_C0G_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.48 native C0G 2-cap vendor land and 101-net parity
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.48 -p 'test_*.py' -v
      - name: V7.49 native KiCad9 before/after 4 LMX2572 input pulldowns
        run: |
          mkdir -p 03_Verifiche/V7.49/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.49/output-ci/v749.original.net 04_KiCad/Assemblaggio_RX_Power_V7.48_TDK_2_C0G_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.49/output-ci/v749.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.48_TDK_2_C0G_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.49/output-ci/v749.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.49_LMX_PULLDOWN_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.49/output-ci/v749.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.49_LMX_PULLDOWN_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.49 four pull-downs native pin net and ERC regression
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.49 -p 'test_*.py' -v
      - name: V7.50 JST J100/J101 vendor connectors native seven-sheet netlist and ERC before/after
        run: |
          mkdir -p 03_Verifiche/V7.50/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.50/output-ci/v750.original.net 04_KiCad/Assemblaggio_RX_Power_V7.49_LMX_PULLDOWN_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.50/output-ci/v750.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.49_LMX_PULLDOWN_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.50/output-ci/v750.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.50_JST_CONNECTORS_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.50/output-ci/v750.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.50_JST_CONNECTORS_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.50 KiCad9 standard library JST VH/GH pads and J100/J101-only footprint netlist parity
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.50 -p 'test_*.py' -v
      - name: V7.51 native TI TPS26600 RTN and threshold safety schematic before/after
        run: |
          mkdir -p 03_Verifiche/V7.51/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.51/output-ci/v751.original.net 04_KiCad/Assemblaggio_RX_Power_V7.50_JST_CONNECTORS_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.51/output-ci/v751.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.50_JST_CONNECTORS_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.51/output-ci/v751.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.51_TPS26600_RTN_SAFETY_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.51/output-ci/v751.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.51_TPS26600_RTN_SAFETY_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.51 fail closed TI eFuse RTN not GND and resistive UVLO OVP corners
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.51 -p 'test_*.py' -v
      - name: V7.52 KiCad9 before/after eFuse MODE 402k latchoff candidate
        run: |
          mkdir -p 03_Verifiche/V7.52/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.52/output-ci/v752.original.net 04_KiCad/Assemblaggio_RX_Power_V7.51_TPS26600_RTN_SAFETY_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.52/output-ci/v752.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.51_TPS26600_RTN_SAFETY_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.52/output-ci/v752.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.52_EFUSE_MODE_DVDT_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.52/output-ci/v752.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.52_EFUSE_MODE_DVDT_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.52 fail closed MODE resistor native net and dVdT latchoff selection
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.52 -p 'test_*.py' -v
      - name: V7.53 static eFuse buck input and fuse envelope (not CAD validation)
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.53 -p 'test_*.py' -v
      - name: V7.54 TPS54202 conditional Ceff and transient regression (no CAD ECO)
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.54 -p 'test_*.py' -v
      - name: V7.55 KiCad9 seven-sheet native before/after TDK C103/C104 BOM-only ECO
        run: |
          mkdir -p 03_Verifiche/V7.55/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.55/output-ci/v755.original.net 04_KiCad/Assemblaggio_RX_Power_V7.52_EFUSE_MODE_DVDT_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.55/output-ci/v755.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.52_EFUSE_MODE_DVDT_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.55/output-ci/v755.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.55_TDK_BUCK_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.55/output-ci/v755.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.55_TDK_BUCK_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.55 TDK candidate native BOM metadata and full pin-net ERC parity
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.55 -p 'test_*.py' -v
      - name: V7.56 native KiCad9 seven-sheet before/after TDK automotive MPN candidate
        run: |
          mkdir -p 03_Verifiche/V7.56/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.56/output-ci/v756.original.net 04_KiCad/Assemblaggio_RX_Power_V7.55_TDK_BUCK_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.56/output-ci/v756.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.55_TDK_BUCK_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.56/output-ci/v756.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.56_TDK_AECQ200_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.56/output-ci/v756.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.56_TDK_AECQ200_MLCC_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: V7.56 TDK AEC-Q200 C103/C104 native graph and ERC preservation
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.56 -p 'test_*.py' -v
      - name: Archive native proof for review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v743-native-sixldo-thermal-NO-FAB-TX
          path: |
            03_Verifiche/V7.43/output-ci/
            03_Verifiche/V7.46/output-ci/
            03_Verifiche/V7.47/output-ci/
            03_Verifiche/V7.48/output-ci/
            03_Verifiche/V7.49/output-ci/
            03_Verifiche/V7.50/output-ci/
            03_Verifiche/V7.51/output-ci/
            03_Verifiche/V7.52/output-ci/
            03_Verifiche/V7.55/output-ci/
            03_Verifiche/V7.56/output-ci/
          if-no-files-found: warn
