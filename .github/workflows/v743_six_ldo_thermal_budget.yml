name: V7.43 six LDO thermal and native U2 PLL VIN repair (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.43/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.43_U2_LDO_IN_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.43_U2_PLL_IN_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native_u2_and_thermal:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Native KiCad9 preinstalled no apt/pip
        run: |
          kicad-cli version
          mkdir -p 03_Verifiche/V7.43/output-ci
      - name: Export seven-sheet netlists and ERC old versus corrected AUX
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.43/output-ci/v743.original.net 04_KiCad/Assemblaggio_RX_Power_V7.41_FB6201_TDK_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.43/output-ci/v743.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.41_FB6201_TDK_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.43/output-ci/v743.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.43_U2_PLL_IN_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.43/output-ci/v743.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.43_U2_PLL_IN_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Fail closed on exact U2 pin-to-net ECO and six sourced regulator thermal budget
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.43 -p 'test_*.py' -v
      - name: Preserve native evidence NO FAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v743-u2-vin-native-plus-thermal-NO-FAB-TX
          path: 03_Verifiche/V7.43/output-ci/
          if-no-files-found: warn
