name: V7.43 six LDO 5V rail thermal budget source gate (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.43/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  six_ldo_thermal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify real KiCad LDO rails, thermal and missing load budget (Python standard library)
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.43 -p 'test_*.py' -v
