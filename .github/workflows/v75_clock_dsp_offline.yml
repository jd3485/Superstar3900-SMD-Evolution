name: V7.5 shared clock and staged DSP model-only (NO FAB NO TX)
on:
  push:
    branches: [feature/v7.5-coherent-clock-multistage-dnp, main]
    paths:
      - '08_Firmware_Prototipi/V7.5/**'
      - '03_Verifiche/V7.5/**'
      - '01_Specifiche/V7.5/**'
      - '07_Componenti/BOM_CLOCK_BRIDGE_V7.5.csv'
      - '.github/workflows/v75_clock_dsp_offline.yml'
  pull_request:
    paths:
      - '08_Firmware_Prototipi/V7.5/**'
      - '03_Verifiche/V7.5/**'
      - '01_Specifiche/V7.5/**'
      - '07_Componenti/BOM_CLOCK_BRIDGE_V7.5.csv'
      - '.github/workflows/v75_clock_dsp_offline.yml'
permissions:
  contents: read
jobs:
  clock-dsp-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V7.5 new software and all-DNP checks
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.5 -p 'test_*.py' -v
      - name: V7.4 DAC bridge regressions
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.4 -p 'test_*.py' -v
      - name: V7.3 causal DSP regressions
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.3 -p 'test_*.py' -v
      - name: V7.2 DUC regressions
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.2 -p 'test_*.py' -v
      - name: V7.1 IF regressions
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.1 -p 'test_*.py' -v
