name: V7.17 native seven-sheet full-radio ERC and interface audit (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.17/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.17_INTEGRATION_HOLD_NOT_FOR_FAB/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  full-radio-integration-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine KiCad 9
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq kicad
          kicad-cli version
      - name: Export the real unchanged 7-sheet root connectivity
        run: |
          mkdir -p 03_Verifiche/V7.17/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.17/output-ci/root_v714.current.net \
            04_KiCad/Assemblaggio_RX_Power_V7.14_LIB_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Native 7-sheet ERC report (RETAIN all original errors and warnings)
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.17/output-ci/root_v714.current.erc.rpt \
            04_KiCad/Assemblaggio_RX_Power_V7.14_LIB_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Native RX standalone ERC no-regression check
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.17/output-ci/rx_v714.current.erc.rpt \
            04_KiCad/Modulo_RX_Test_50ohm_V7.14_LIB_DIAGNOSTIC_NOT_FOR_FAB/S3900E_RX_LIB_V7_14_NOT_FOR_FAB.kicad_sch
      - name: Export KiCad native V7.17 versioned seven-sheet HOLD master netlist
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.17/output-ci/root_v717.hold_master.net \
            04_KiCad/Assemblaggio_RX_Power_V7.17_INTEGRATION_HOLD_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Native KiCad ERC of V7.17 full-radio HOLD master
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.17/output-ci/root_v717.hold_master.erc.rpt \
            04_KiCad/Assemblaggio_RX_Power_V7.17_INTEGRATION_HOLD_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Audit every real root ERC category and all 15 netlist interface candidates
        run: python3 -B 03_Verifiche/V7.17/audit_full_board_native_v717.py
      - name: Verify 99 exact native KiCad net and pin memberships preserved V7.14 to V7.17
        run: python3 -B 03_Verifiche/V7.17/verify_versioned_full_board_master_v717.py
      - name: Verify 18 explicit V7.17 interface, hold-master and TX safety tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.17 -p 'test_*.py' -v
      - name: Preserve all 223 prior KiCad, DSP, PLL and firmware regression tests
        run: |
          for version in V7.16 V7.15 V7.14 V7.13 V7.12 V7.11 V7.10 V7.9 V7.8 V7.7 V7.6 V7.5 V7.4 V7.3 V7.2 V7.1; do
            python3 -B -m unittest discover -s 03_Verifiche/${version} -p 'test_*.py' -v
          done
      - name: Upload native evidence and classification, no manufacturing data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v717-real-kicad-full-board-erc-interface-NO-FAB-NO-TX
          path: 03_Verifiche/V7.17/output-ci/
          if-no-files-found: warn
