name: V7.40 FB6201 TDK 600ohm 2A vendor review KiCad9 parity (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.40/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.40_FB6201_TDK_0805_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.40_FB6201_TDK_0805_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fb6201_native:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Native KiCad9 already in container (no apt, no pip)
        run: |
          kicad-cli version
          mkdir -p 03_Verifiche/V7.40/output-ci
      - name: Export before/after 7-sheet native netlist and full ERC
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.40/output-ci/v740.original.net 04_KiCad/Assemblaggio_RX_Power_V7.36_C6231_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.40/output-ci/v740.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.36_C6231_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.40/output-ci/v740.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.40_FB6201_TDK_0805_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.40/output-ci/v740.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.40_FB6201_TDK_0805_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Gate exact FB6201 only, all 101 nets, ERC and electrical power budget
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.40 -p 'test_*.py' -v
      - name: Save native evidence (NO FAB TX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v740-fb6201-tdk-native-NO-FAB-TX
          path: 03_Verifiche/V7.40/output-ci/
          if-no-files-found: warn
