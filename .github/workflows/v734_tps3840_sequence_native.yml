name: V7.34 TPS3840 supervised codec LDOIN native KiCad9 (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.34/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.34_TPS3840_IOVDD_SEQUENCE_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.34_TPS3840_IOVDD_SEQUENCE_REVIEW_NOT_FOR_FAB/**'
      - '.github/workflows/v734_tps3840_sequence_native.yml'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native_supervisor:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Use existing KiCad9 container (no apt/pip)
        run: |
          kicad-cli version
          mkdir -p 03_Verifiche/V7.34/output-ci
      - name: Export native seven-sheet before-after netlist and full ERC reports
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.34/output-ci/v734.original.net 04_KiCad/Assemblaggio_RX_Power_V7.33_YAGEO_8R_0402_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.34/output-ci/v734.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.33_YAGEO_8R_0402_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.34/output-ci/v734.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.34_TPS3840_IOVDD_SEQUENCE_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.34/output-ci/v734.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.34_TPS3840_IOVDD_SEQUENCE_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Fail closed on exact pin-net changes and ERC errors
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.34 -p 'test_*.py' -v
      - name: Evidence for review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v734-supervised-io-native-NO-FAB-TX
          path: 03_Verifiche/V7.34/output-ci/
          if-no-files-found: warn
