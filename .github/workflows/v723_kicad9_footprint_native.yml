name: V7.23 KiCad9 native vendor footprint load only - NO FAB NO TX
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.23/**'
      - '04_KiCad/Librerie_Footprint_V7.22_DBV_TI_HOLD/**'
      - '04_KiCad/Librerie_Footprint_V7.22_RHB_TI_HOLD/**'
      - '04_KiCad/Librerie_Footprint_V7.22_ST_LQFP_TI_HOLD/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify_native_library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PCBNEW Python bindings from Ubuntu KiCad package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kicad
          /usr/bin/python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
          kicad-cli version
      - name: Load all three candidate footprint files into the genuine KiCad native C++ model
        run: |
          /usr/bin/python3 -B 03_Verifiche/V7.23/audit_native_footprints_v723.py
      - name: Record native footprint load evidence only (no PCB/Gerber)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v723-pcbnew-native-footprints-NO-FAB-NO-TX
          path: 03_Verifiche/V7.23/output-ci/v723.native_footprint_load.json
          if-no-files-found: warn
