name: V7.14 native KiCad RX local library access and ERC diagnostic (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '04_KiCad/Modulo_RX_Test_50ohm_V7.14_LIB_DIAGNOSTIC_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.14_LIB_NOT_FOR_FAB/**'
      - '03_Verifiche/V7.14/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ki9-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native KiCad CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq kicad
          kicad-cli version
      - name: Export original V7.13 and local-symbol V7.14 netlists
        run: |
          mkdir -p 03_Verifiche/V7.14/output-ci
          kicad-cli sch export netlist -o 03_Verifiche/V7.14/output-ci/v713.net \
            04_KiCad/Modulo_RX_Test_50ohm_V7.13_GRID_NOT_FOR_FAB/S3900E_RX_GRID_V7_13_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.14/output-ci/v714.net \
            04_KiCad/Modulo_RX_Test_50ohm_V7.14_LIB_DIAGNOSTIC_NOT_FOR_FAB/S3900E_RX_LIB_V7_14_NOT_FOR_FAB.kicad_sch
      - name: Native KiCad ERC before local libraries (all warnings retained)
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.14/output-ci/v713.erc.rpt \
            04_KiCad/Modulo_RX_Test_50ohm_V7.13_GRID_NOT_FOR_FAB/S3900E_RX_GRID_V7_13_NOT_FOR_FAB.kicad_sch
      - name: Native KiCad ERC with local RX symbol library (all warnings retained)
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.14/output-ci/v714.erc.rpt \
            04_KiCad/Modulo_RX_Test_50ohm_V7.14_LIB_DIAGNOSTIC_NOT_FOR_FAB/S3900E_RX_LIB_V7_14_NOT_FOR_FAB.kicad_sch
      - name: Print specific native ERC library reasons from both reports
        run: |
          echo '--- V7.13 sample library warnings ---'
          grep -A 6 -E '^\[(lib_symbol_issues|footprint_link_issues)\]' \
            03_Verifiche/V7.14/output-ci/v713.erc.rpt | head -90 || true
          echo '--- V7.14 sample library warnings ---'
          grep -A 6 -E '^\[(lib_symbol_issues|footprint_link_issues)\]' \
            03_Verifiche/V7.14/output-ci/v714.erc.rpt | head -90 || true
      - name: KiCad ERC and exact net-pin non-regression probe
        run: python3 -B 03_Verifiche/V7.14/probe_library_erc_v714.py
      - name: Static original/clone source and KiCad project tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.14 -p 'test_*.py' -v
      - name: Native KiCad DRC on V7.14 RX standalone KiCad project
        run: |
          kicad-cli pcb drc -o 03_Verifiche/V7.14/output-ci/v714.rx.drc.rpt \
            04_KiCad/Modulo_RX_Test_50ohm_V7.14_LIB_DIAGNOSTIC_NOT_FOR_FAB/S3900E_RX_LIB_V7_14_NOT_FOR_FAB.kicad_pcb
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,"03_Verifiche/V7.11")
          from confronta_drc_rx_v711 import parse
          report=parse("03_Verifiche/V7.14/output-ci/v714.rx.drc.rpt")
          print("NATIVE V7.14 RX BOARD DRC",json.dumps(report,indent=2))
          assert report["unconnected_items"]==63,"RX board routing unexpectedly changed"
          assert report["drc_violations"]==72,"Expected exactly 70 dangling vias +2 real footprint mismatches"
          assert report["categories"].get("via_dangling",0)==70
          assert report["categories"].get("lib_footprint_mismatch",0)==2
          assert report["categories"].get("drill_out_of_range",0)==0
          PY
          echo '--- V7.14 native board DRC sample ---'
          head -45 03_Verifiche/V7.14/output-ci/v714.rx.drc.rpt
      - name: Preserve V7.13 through V7.1 KiCad, DSP and firmware regressions
        run: |
          for version in V7.13 V7.12 V7.11 V7.10 V7.9 V7.8 V7.7 V7.6 V7.5 V7.4 V7.3 V7.2 V7.1; do
            python3 -B -m unittest discover -s 03_Verifiche/${version} -p 'test_*.py' -v
          done
      - name: Export KiCad native netlists from isolated seven-sheet V7.13 and V7.14 roots
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.14/output-ci/root_v713.net \
            04_KiCad/Assemblaggio_RX_Power_V7.13_GRID_NOT_FOR_FAB/S3900E_RX_POWER_V7_13_GRID_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.14/output-ci/root_v714.net \
            04_KiCad/Assemblaggio_RX_Power_V7.14_LIB_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Native KiCad root ERC V7.13 and V7.14 (retain ALL errors and warnings)
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.14/output-ci/root_v713.erc.rpt \
            04_KiCad/Assemblaggio_RX_Power_V7.13_GRID_NOT_FOR_FAB/S3900E_RX_POWER_V7_13_GRID_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.14/output-ci/root_v714.erc.rpt \
            04_KiCad/Assemblaggio_RX_Power_V7.14_LIB_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Require all 99 exact native root net pin memberships unchanged
        run: python3 -B 03_Verifiche/V7.14/verifica_root_kicad_v714.py
      - name: Upload genuine KiCad ERC and netlists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v714-native-kicad-library-diags-NO-FAB
          path: 03_Verifiche/V7.14/output-ci/
          if-no-files-found: warn
