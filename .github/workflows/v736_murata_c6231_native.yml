name: V7.36 Murata C6231 0402 vendor review KiCad9 native parity (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.36/**'
      - '04_KiCad/Librerie_Footprint_V7.36_MURATA_GRM15_HOLD/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.36_C6231_MURATA_GRM15_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.36_C6231_MURATA_GRM15_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  murata_vendor_land:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reuse KiCad9 (no apt or pip)
        run: |
          kicad-cli version
          python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
          mkdir -p 03_Verifiche/V7.36/output-ci
      - name: Export before-after native seven-sheet netlists/ERC
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.36/output-ci/v736.original.net 04_KiCad/Assemblaggio_RX_Power_V7.35_TPS3840_DBV5_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.36/output-ci/v736.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.35_TPS3840_DBV5_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.36/output-ci/v736.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.36_C6231_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.36/output-ci/v736.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.36_C6231_MURATA_GRM15_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Fail closed on C6231 exact land and zero pin-net delta
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.36 -p 'test_*.py' -v
      - name: Archive native evidence (NO FAB TX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v736-murata-c6231-native-NO-FAB-TX
          path: 03_Verifiche/V7.36/output-ci/
          if-no-files-found: warn
