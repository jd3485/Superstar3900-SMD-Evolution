name: V7.37 codec brownout TI PVT corners (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.37/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  brownout:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: No KiCad install needed; read-only vendor envelope
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.37 -p 'test_*.py' -v
