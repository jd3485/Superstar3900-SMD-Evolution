name: V7.33 eight Yageo resistors native KiCad9 parity (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.33/**'
      - '04_KiCad/Librerie_Footprint_V7.33_YAGEO_0402_HOLD/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.33_YAGEO_8R_0402_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.33_YAGEO_8R_0402_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native_yageo:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preinstalled KiCad9 and PCBNEW - no apt no pip
        run: |
          kicad-cli version
          python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
          mkdir -p 03_Verifiche/V7.33/output-ci
      - name: Native KiCad9 netlist ERC original and revised seven sheets
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.33/output-ci/v733.original.net 04_KiCad/Assemblaggio_RX_Power_V7.32_SITIME_X6201_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.33/output-ci/v733.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.32_SITIME_X6201_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.33/output-ci/v733.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.33_YAGEO_8R_0402_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.33/output-ci/v733.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.33_YAGEO_8R_0402_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Fail closed on pad MPN node and ERC delta
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.33 -p 'test_*.py' -v
      - name: Archive only native evidence NO FAB TX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v733-native-yageo-eight-R-NO-FAB-TX
          path: 03_Verifiche/V7.33/output-ci/
          if-no-files-found: warn
