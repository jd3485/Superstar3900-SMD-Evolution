name: Superstar3900 - integrita baseline V7.0 e test RX (NO FAB NO TX)
on:
  pull_request:
    paths:
      - 'ci/verifica_manifest.py'
      - 'MANIFEST_SHA256_V7.0.csv'
      - '03_Verifiche/V6.9/**'
      - '03_Verifiche/V7.0/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verifica-v70:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SHA256 immutabili baseline tag v7.0 (non branch main)
        run: |
          git worktree add --detach ../superstar-baseline-v70 refs/tags/v7.0
          python -B ../superstar-baseline-v70/ci/verifica_manifest.py MANIFEST_SHA256_V7.0.csv --attesi 1280
      - name: Installazione dipendenze dei test numerici
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Regressione V6.9 LO2 e BFO
        run: python -B 03_Verifiche/V6.9/test_lo2_demod_v69.py
      - name: Regressione V7.0 demod e DSP
        run: python -B 03_Verifiche/V7.0/test_demod_v70.py
