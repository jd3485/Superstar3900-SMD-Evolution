name: Superstar3900 - integrita V7.0 e test RX (NO FAB NO TX)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica-v70:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SHA256 di tutti i sorgenti originali V7.0
        run: python -B ci/verifica_manifest.py MANIFEST_SHA256_V7.0.csv --attesi 1280
      - name: Installazione dipendenze dei test numerici
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Regressione V6.9 LO2 e BFO
        run: python -B 03_Verifiche/V6.9/test_lo2_demod_v69.py
      - name: Regressione V7.0 demod e DSP
        run: python -B 03_Verifiche/V7.0/test_demod_v70.py
