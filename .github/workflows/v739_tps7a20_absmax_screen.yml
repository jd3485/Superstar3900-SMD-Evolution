name: V7.39 TPS7A20 OUT-IN voltage absmax screening (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.39/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  voltage_envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: KiCad source-derived capacitor/voltage envelope, standard Python only
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.39 -p 'test_*.py' -v
