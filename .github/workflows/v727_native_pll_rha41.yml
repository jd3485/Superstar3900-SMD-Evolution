name: V7.27 TI PLL RHA41 vendor footprint native package and net/ERC parity (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.27/**'
      - '04_KiCad/Librerie_Footprint_V7.27_TI_RHA_HOLD/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.27_PLL_RHA41_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.27_PLL_RHA41_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pll_rha_native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install real KiCad9 native PCBNEW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kicad
          /usr/bin/python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
          mkdir -p 03_Verifiche/V7.27/output-ci
      - name: Real KiCad before/after seven-sheet netlist/ERC
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.27/output-ci/v727.original.net 04_KiCad/Assemblaggio_RX_Power_V7.26_UNIFIED_SYMBOL_LIB_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.27/output-ci/v727.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.26_UNIFIED_SYMBOL_LIB_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.27/output-ci/v727.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.27_PLL_RHA41_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.27/output-ci/v727.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.27_PLL_RHA41_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Native 41 pad plus EP paste package, 14 regression gates
        run: /usr/bin/python3 -B -m unittest discover -s 03_Verifiche/V7.27 -p 'test_*.py' -v
      - name: Store KiCad electrical proof only, no Gerber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v727-native-pll-RHA41-HOLD-NO-FAB-TX
          path: 03_Verifiche/V7.27/output-ci/
          if-no-files-found: warn
