name: V7.29 Littelfuse F200 Nano2 451 vendor land native net/ERC parity (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.29/**'
      - '04_KiCad/Librerie_Footprint_V7.29_LITTELFUSE_451_HOLD/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.29_F200_LITTELFUSE_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.29_F200_LITTELFUSE_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native_f200_review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9 and PCBNEW native Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kicad
          /usr/bin/python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
          mkdir -p 03_Verifiche/V7.29/output-ci
      - name: Actual KiCad before/after ERC and netlist
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.29/output-ci/v729.original.net 04_KiCad/Assemblaggio_RX_Power_V7.28_L100_BOURNS_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.29/output-ci/v729.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.28_L100_BOURNS_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.29/output-ci/v729.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.29_F200_LITTELFUSE_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.29/output-ci/v729.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.29_F200_LITTELFUSE_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Native vendor land 2 pads with net and ERC safety 14 tests
        run: /usr/bin/python3 -B -m unittest discover -s 03_Verifiche/V7.29 -p 'test_*.py' -v
      - name: Save only netlist ERC and numeric evidence no PCB fabrication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v729-native-f200-Littelfuse-HOLD-NO-FAB-TX
          path: 03_Verifiche/V7.29/output-ci/
          if-no-files-found: warn
