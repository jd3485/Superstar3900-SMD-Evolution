name: V7.35 TPS3840 DBV0005A vendor land native KiCad9 parity (NO FAB TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.35/**'
      - '04_KiCad/Librerie_Footprint_V7.35_TI_TPS3840_DBV5_HOLD/**'
      - '04_KiCad/Modulo_MCU_CODEC_V7.35_TPS3840_DBV5_VENDOR_LAND_REVIEW_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.35_TPS3840_DBV5_VENDOR_LAND_REVIEW_NOT_FOR_FAB/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native_dbv5:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Native KiCad9 and existing pcbnew (no apt, no pip)
        run: |
          kicad-cli version
          python3 -c 'import pcbnew; print(pcbnew.GetBuildVersion())'
          mkdir -p 03_Verifiche/V7.35/output-ci
      - name: Seven-sheet netlists and ERC before/after
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.35/output-ci/v735.original.net 04_KiCad/Assemblaggio_RX_Power_V7.34_TPS3840_IOVDD_SEQUENCE_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.35/output-ci/v735.original.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.34_TPS3840_IOVDD_SEQUENCE_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch export netlist -o 03_Verifiche/V7.35/output-ci/v735.revised.net 04_KiCad/Assemblaggio_RX_Power_V7.35_TPS3840_DBV5_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
          kicad-cli sch erc -o 03_Verifiche/V7.35/output-ci/v735.revised.erc.rpt 04_KiCad/Assemblaggio_RX_Power_V7.35_TPS3840_DBV5_VENDOR_LAND_REVIEW_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Fail closed on TI physical five-pad geometry and zero pin-net delta
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.35 -p 'test_*.py' -v
      - name: Archive native evidence only (NO FAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v735-tps3840-ti-dbv5-native-NO-FAB-TX
          path: 03_Verifiche/V7.35/output-ci/
          if-no-files-found: warn
