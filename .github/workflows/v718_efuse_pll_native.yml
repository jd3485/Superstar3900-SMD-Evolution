name: V7.18 native eFuse power-output model and PLL ERC validation (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '03_Verifiche/V7.18/**'
      - '04_KiCad/Gerarchico_Alimentazioni_V7.18_PINMODEL_NOT_FOR_FAB/**'
      - '04_KiCad/Assemblaggio_RX_Power_V7.18_POWER_PINMODEL_NOT_FOR_FAB/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ki9-efuse-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine KiCad 9 CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kicad
          kicad-cli version
          mkdir -p 03_Verifiche/V7.18/output-ci
      - name: Export native V7.17 seven-sheet netlist
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.18/output-ci/root.v717.net \
            04_KiCad/Assemblaggio_RX_Power_V7.17_INTEGRATION_HOLD_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Export native V7.18 seven-sheet ECO netlist
        run: |
          kicad-cli sch export netlist -o 03_Verifiche/V7.18/output-ci/root.v718.net \
            04_KiCad/Assemblaggio_RX_Power_V7.18_POWER_PINMODEL_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Report native V7.17 baseline full ERC without disabling warnings
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.18/output-ci/root.v717.erc.rpt \
            04_KiCad/Assemblaggio_RX_Power_V7.17_INTEGRATION_HOLD_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Report native V7.18 candidate full ERC without disabling warnings
        run: |
          kicad-cli sch erc -o 03_Verifiche/V7.18/output-ci/root.v718.erc.rpt \
            04_KiCad/Assemblaggio_RX_Power_V7.18_POWER_PINMODEL_NOT_FOR_FAB/S3900E_RX_POWER_V7_14_LIB_NOT_FOR_FAB.kicad_sch
      - name: Verify exact ERC delta and every native ref-pin connection unchanged
        run: /usr/bin/python3 -B 03_Verifiche/V7.18/check_efuse_out_native_v718.py
      - name: Native KiCad PLL loop filter topology differential on throwaway 7-sheet project clones
        run: /usr/bin/python3 -B 03_Verifiche/V7.18/probe_pll_loop_native_v718.py
      - name: Verify V7.18 12 eFuse power-output and HOLD tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.18 -p 'test_*.py' -v
      - name: Preserve all V7.17-V7.1 Python regressions
        run: |
          for version in V7.17 V7.16 V7.15 V7.14 V7.13 V7.12 V7.11 V7.10 V7.9 V7.8 V7.7 V7.6 V7.5 V7.4 V7.3 V7.2 V7.1; do
            python3 -B -m unittest discover -s 03_Verifiche/${version} -p 'test_*.py' -v
          done
      - name: Archive real KiCad ERC, pin parity and JSON, never production data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v718-real-kicad-efuse-pinmodel-NO-FAB-NO-TX
          path: 03_Verifiche/V7.18/output-ci/
          if-no-files-found: warn
