name: V7.10 KiCad native RX/POWER integration audit (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '04_KiCad/Assemblaggio_RX_Power_V7.10_NOT_FOR_FAB/**'
      - '03_Verifiche/V7.10/**'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  kicad-native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native KiCad CLI (not Python pretending to be ERC/DRC)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kicad
          kicad-cli version
      - name: Static source manifest and isolated hierarchy contracts
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.10 -p 'test_*.py' -v
      - name: Native KiCad schematic netlist export (diagnostic, no hardware TX)
        run: |
          mkdir -p 03_Verifiche/V7.10/output-ci
          kicad-cli sch export netlist \
            -o 03_Verifiche/V7.10/output-ci/integration.net \
            04_KiCad/Assemblaggio_RX_Power_V7.10_NOT_FOR_FAB/S3900E_RX_POWER_INTEGRATION_V7_10_NOT_FOR_FAB.kicad_sch
          test -s 03_Verifiche/V7.10/output-ci/integration.net
      - name: Audit duplicate component references in KiCad-generated netlist
        run: python3 -B 03_Verifiche/V7.10/analizza_netlist_kicad_v710.py
      - name: Native KiCad ERC and RX PCB DRC (legacy defects allowed but COUNTED)
        run: |
          python3 -B 03_Verifiche/V7.10/esegui_kicad_audit_v710.py
      - name: Validate real KiCad diagnostics without falsely certifying ERC or DRC
        run: python3 -B 03_Verifiche/V7.10/valida_report_nativi_v710.py
      - name: Package editable KiCad SOURCE hierarchy for offline inspection (NOT Gerber)
        run: |
          bundle_root="$(mktemp -d)"
          mkdir -p "$bundle_root/04_KiCad"
          for folder in \
            04_KiCad/Assemblaggio_RX_Power_V7.10_NOT_FOR_FAB \
            04_KiCad/Gerarchico_Alimentazioni_V1.5 \
            04_KiCad/Modulo_MCU_CODEC_V2.1 \
            04_KiCad/Modulo_RX_Test_50ohm_V5.2_PARITY_LINK_STUDY_NOT_FOR_FAB; do
            cp -a "$folder" "$bundle_root/04_KiCad/"
          done
          mkdir -p "$bundle_root/01_Specifiche/V7.10"
          cp 01_Specifiche/V7.10/PIANO_CAD_INTEGRAZIONE_RX_POWER_V7.10.md "$bundle_root/01_Specifiche/V7.10/"
          (cd "$bundle_root" && zip -q -r "$GITHUB_WORKSPACE/03_Verifiche/V7.10/output-ci/V7_10_SORGENTI_KICAD_NO_FAB.zip" .)
          test -s 03_Verifiche/V7.10/output-ci/V7_10_SORGENTI_KICAD_NO_FAB.zip
      - name: Upload actual native KiCad ERC DRC reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v710-kicad-native-audit-not-for-fab
          path: |
            03_Verifiche/V7.10/output-ci/
          if-no-files-found: warn
      - name: All historical Python DSP firmware and RX regressions V7.1 to V7.9
        run: |
          for version in V7.1 V7.2 V7.3 V7.4 V7.5 V7.6 V7.7 V7.8 V7.9; do
            echo "::group::Historical regression ${version}"
            python3 -B -m unittest discover -s 03_Verifiche/${version} -p 'test_*.py' -v
            echo "::endgroup::"
          done
