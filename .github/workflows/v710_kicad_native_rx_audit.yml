name: V7.10 KiCad native RX/POWER integration audit (NO FAB NO TX)
on:
  push:
    branches: ['feature/v7.10-kicad-native-integration-audit', main]
    paths:
      - '04_KiCad/Assemblaggio_RX_Power_V7.10_NOT_FOR_FAB/**'
      - '03_Verifiche/V7.10/**'
      - '.github/workflows/v710_kicad_native_rx_audit.yml'
  pull_request:
    paths:
      - '04_KiCad/Assemblaggio_RX_Power_V7.10_NOT_FOR_FAB/**'
      - '03_Verifiche/V7.10/**'
      - '.github/workflows/v710_kicad_native_rx_audit.yml'
permissions:
  contents: read
jobs:
  kicad-native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native KiCad CLI (not Python pretending to be ERC/DRC)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kicad
          kicad-cli version
      - name: Static source manifest and isolated hierarchy contracts
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.10 -p 'test_*.py' -v
      - name: Native KiCad schematic netlist export (diagnostic, no hardware TX)
        run: |
          mkdir -p 03_Verifiche/V7.10/output-ci
          kicad-cli sch export netlist \
            -o 03_Verifiche/V7.10/output-ci/integration.net \
            04_KiCad/Assemblaggio_RX_Power_V7.10_NOT_FOR_FAB/S3900E_RX_POWER_INTEGRATION_V7_10_NOT_FOR_FAB.kicad_sch
          test -s 03_Verifiche/V7.10/output-ci/integration.net
      - name: Native KiCad ERC and RX PCB DRC (legacy defects allowed but COUNTED)
        run: |
          python3 -B 03_Verifiche/V7.10/esegui_kicad_audit_v710.py
      - name: Upload actual native KiCad ERC DRC reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v710-kicad-native-audit-not-for-fab
          path: |
            03_Verifiche/V7.10/output-ci/
          if-no-files-found: warn
      - name: All historical Python DSP firmware and RX regressions V7.1 to V7.9
        run: |
          for version in V7.1 V7.2 V7.3 V7.4 V7.5 V7.6 V7.7 V7.8 V7.9; do
            echo "::group::Historical regression ${version}"
            python3 -B -m unittest discover -s 03_Verifiche/${version} -p 'test_*.py' -v
            echo "::endgroup::"
          done
