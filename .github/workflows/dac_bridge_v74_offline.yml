name: V7.4 DAC900 bridge / I-V offline checks (NO FAB NO TX)
on:
  pull_request:
    paths:
      - '01_Specifiche/V7.4/**'
      - '03_Verifiche/V7.4/**'
      - '08_Firmware_Prototipi/V7.4/**'
      - '07_Componenti/BOM_DAC_BRIDGE_IV_V7.4.csv'
      - '!03_Verifiche/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V7.4 offline DAC bridge/IV tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.4 -p 'test_*.py' -v
      - name: V7.3 causal DUC regression tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.3 -p 'test_*.py' -v
      - name: V7.2 DUC regression tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.2 -p 'test_*.py' -v
      - name: V7.1 IF regression tests
        run: python3 -B -m unittest discover -s 03_Verifiche/V7.1 -p 'test_*.py' -v
