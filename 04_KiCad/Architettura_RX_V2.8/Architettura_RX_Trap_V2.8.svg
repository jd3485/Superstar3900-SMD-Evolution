<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="280" viewBox="0 0 1030 280"><rect width="1030" height="280" fill="#f7f9fc"/><text x="32" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="#172938">V2.8 — Preselettore sperimentale RX 50 Ω</text><text x="32" y="62" font-family="Arial" font-size="13" fill="#46576a">Non e uno schema elettrico: rappresentazione del flusso e dei filtri candidati</text><rect x="25" y="95" width="185" height="92" rx="9" fill="#e6eff8" stroke="#244861"/><text x="117.5" y="127" text-anchor="middle" font-size="15" font-family="Arial" font-weight="bold" fill="#172938">Ingresso 50 Ω</text><text x="117.5" y="157" text-anchor="middle" font-size="12" font-family="Arial" fill="#46576a">VNA / antenna in RX</text><path d="M210 141 H239" stroke="#0a8576" stroke-width="3"/><path d="M241 141 l-10 -5 v10z" fill="#0a8576"/><rect x="245" y="95" width="185" height="92" rx="9" fill="#e6eff8" stroke="#244861"/><text x="337.5" y="127" text-anchor="middle" font-size="15" font-family="Arial" font-weight="bold" fill="#172938">HP3 opzionale</text><text x="337.5" y="157" text-anchor="middle" font-size="12" font-family="Arial" fill="#46576a">12 MHz, soppressione HF</text><path d="M430 141 H459" stroke="#0a8576" stroke-width="3"/><path d="M461 141 l-10 -5 v10z" fill="#0a8576"/><rect x="465" y="95" width="205" height="92" rx="9" fill="#e6eff8" stroke="#244861"/><text x="567.5" y="127" text-anchor="middle" font-size="15" font-family="Arial" font-weight="bold" fill="#172938">LP7 + 2 notch</text><text x="567.5" y="157" text-anchor="middle" font-size="12" font-family="Arial" fill="#46576a">7 sezioni / 9 passivi</text><path d="M670 141 H699" stroke="#0a8576" stroke-width="3"/><path d="M701 141 l-10 -5 v10z" fill="#0a8576"/><rect x="710" y="95" width="150" height="92" rx="9" fill="#e6eff8" stroke="#244861"/><text x="785.0" y="127" text-anchor="middle" font-size="15" font-family="Arial" font-weight="bold" fill="#172938">LNA / RF gain</text><text x="785.0" y="157" text-anchor="middle" font-size="12" font-family="Arial" fill="#46576a">Da progettare</text><path d="M860 141 H889" stroke="#0a8576" stroke-width="3"/><path d="M891 141 l-10 -5 v10z" fill="#0a8576"/><rect x="900" y="95" width="110" height="92" rx="9" fill="#e6eff8" stroke="#244861"/><text x="955.0" y="127" text-anchor="middle" font-size="15" font-family="Arial" font-weight="bold" fill="#172938">Mixer</text><text x="955.0" y="157" text-anchor="middle" font-size="12" font-family="Arial" fill="#46576a">FI 10,695 MHz</text><text x="32" y="230" font-family="Arial" font-size="13" fill="#953723">Punto critico: la variante senza HP3 lascia passare segnali HF al di sotto dei 25 MHz</text></svg>