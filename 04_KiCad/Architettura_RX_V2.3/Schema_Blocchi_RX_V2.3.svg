<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="940" height="260">
<rect width="940" height="260" fill="#fbfdfe"/>
<style>.node{fill:#f2f8fa;stroke:#3c6170;stroke-width:2}.title{font-family:DejaVu Sans,Arial,sans-serif;font-size:14px;font-weight:700;fill:#223a44}.small{font-family:DejaVu Sans,Arial,sans-serif;font-size:11px;fill:#445962}.link{stroke:#1b6b79;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#1b6b79"/></marker></defs>
<text x="24" y="30" class="title">Superstar 3900 SMD Evolution - ricevente RF V2.3 (STUDIO)</text>
<text x="24" y="49" class="small">La suddivisione della perdita non e' ancora un filtro progettato - reiezione delle immagini da verificare.</text>
<rect class="node" x="18" y="85" width="115" height="78" rx="8"/><text x="75" y="110" class="title" text-anchor="middle">Antenna</text><text x="75" y="128" class="small" text-anchor="middle">T/R RX</text><text x="75" y="144" class="small" text-anchor="middle">protezioni</text>
<rect class="node" x="164" y="85" width="134" height="78" rx="8"/><text x="231" y="110" class="title" text-anchor="middle">Filtro 1</text><text x="231" y="128" class="small" text-anchor="middle">prima LNA</text><text x="231" y="144" class="small" text-anchor="middle">1,5 dB ipotesi</text>
<rect class="node" x="328" y="85" width="132" height="78" rx="8"/><text x="394" y="110" class="title" text-anchor="middle">ADL5535</text><text x="394" y="128" class="small" text-anchor="middle">LNA opzionale</text><text x="394" y="144" class="small" text-anchor="middle">bypass</text>
<rect class="node" x="490" y="85" width="122" height="78" rx="8"/><text x="551" y="110" class="title" text-anchor="middle">Pad 0/6 dB</text><text x="551" y="128" class="small" text-anchor="middle">commutabile</text><text x="551" y="144" class="small" text-anchor="middle">post-LNA</text>
<rect class="node" x="642" y="85" width="125" height="78" rx="8"/><text x="704" y="110" class="title" text-anchor="middle">Filtro 2</text><text x="704" y="128" class="small" text-anchor="middle">prima mixer</text><text x="704" y="144" class="small" text-anchor="middle">3,0 dB ipotesi</text>
<rect class="node" x="797" y="85" width="125" height="78" rx="8"/><text x="859" y="110" class="title" text-anchor="middle">ADE-1+</text><text x="859" y="128" class="small" text-anchor="middle">LO +7dBm</text><text x="859" y="144" class="small" text-anchor="middle">FI 10,695MHz</text>
<path class="link" d="M133 124 H164"/><path class="link" d="M298 124 H328"/><path class="link" d="M460 124 H490"/><path class="link" d="M612 124 H642"/><path class="link" d="M767 124 H797"/>
<text class="small" x="23" y="211">Guadagno e figura di rumore: modello Friis; linearita': IIP3 a due toni ideale, non P1dB.</text>
<text class="small" x="23" y="231">Il pad dopo l'LNA protegge il mixer, NON impedisce il sovraccarico dell'amplificatore stesso.</text>
